name: Refresh SPHEREx exposure index

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: spherex-index-production
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'azizbekphd/sac26' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check snapshot age
        id: age
        run: |
          timestamp=$(jq -r '.builtAt // empty' deploy/spherex-index.lock)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$timestamp" ]] ||
            (( $(date -u +%s) - $(date -ud "$timestamp" +%s) >= 6*86400+12*3600 )); then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.age.outputs.refresh == 'true'
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
        if: steps.age.outputs.refresh == 'true'
      - name: Refresh the exposure index from S3
        id: refresh
        if: steps.age.outputs.refresh == 'true'
        env:
          PYTHONPATH: .
          OPENBLAS_NUM_THREADS: '1'
        run: |
          jq -e 'length > 0' deploy/spherex-index.lock ||
            { echo 'Run Bootstrap SPHEREx exposure index from S3 first.'; exit 1; }
          python -u deploy/install-spherex-index.py deploy/spherex-index.lock "$RUNNER_TEMP/previous.sqlite3"
          python -u deploy/build-spherex-s3-index.py refresh "$RUNNER_TEMP/spherex.sqlite3" \
            "$RUNNER_TEMP/previous.sqlite3" deploy/spherex-index.lock
          if [[ -f "$RUNNER_TEMP/spherex.sqlite3" ]]; then
            gzip -1 -c "$RUNNER_TEMP/spherex.sqlite3" > "$RUNNER_TEMP/spherex.sqlite3.gz"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish snapshot and select it for the next Render build
        id: publish
        if: steps.refresh.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: spherex-index-v1-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/publish-spherex-index.sh "incremental S3 FITS metadata"
      - name: Verify the snapshot and S3 previews on Render
        if: steps.age.outputs.refresh == 'true'
        run: |
          lock="$RUNNER_TEMP/spherex-index.lock"
          if [[ ! -f "$lock" ]]; then lock=deploy/spherex-index.lock; fi
          python deploy/verify-spherex-render.py "$lock"
      - name: Restore the last good snapshot if publication or verification failed
        if: failure() && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash deploy/publish-spherex-index.sh --restore; then
            python deploy/verify-spherex-render.py deploy/spherex-index.lock
          else
            result=$?
            if [[ "$result" != 3 ]]; then exit "$result"; fi
          fi
